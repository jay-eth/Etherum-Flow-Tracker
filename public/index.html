<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthFlow | Ethereum Transaction Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(217.2 32.6% 17.5%)",
                        input: "hsl(217.2 32.6% 17.5%)",
                        ring: "hsl(224.3 76.3% 48%)",
                        background: "hsl(222.2 84% 4.9%)",
                        foreground: "hsl(210 40% 98%)",
                        primary: {
                            DEFAULT: "hsl(221.2 83.2% 53.3%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                        secondary: {
                            DEFAULT: "hsl(217.2 32.6% 17.5%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                        muted: {
                            DEFAULT: "hsl(217.2 32.6% 17.5%)",
                            foreground: "hsl(215.4 16.3% 46.9%)",
                        },
                        accent: {
                            DEFAULT: "hsl(217.2 32.6% 17.5%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                        card: {
                            DEFAULT: "hsl(222.2 84% 4.9%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                    },
                }
            }
        }
    </script>
    <style>
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
            50% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }
        }
        .tech-glow { animation: glow 3s infinite; }
        .grid-bg {
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-background text-foreground min-h-screen grid-bg selection:bg-primary/30">
    <div id="app" class="flex flex-col h-screen">
        <header class="border-b border-border bg-background/80 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center tech-glow">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <span class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-blue-400">
                        EthFlow
                    </span>
                </div>

                <div class="flex-1 max-w-2xl flex items-center gap-2">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <input 
                            type="text" 
                            id="search-input" 
                            placeholder="Wallet address or transaction hash..." 
                            class="block w-full pl-10 pr-3 py-2 bg-secondary border border-border rounded-md leading-5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm"
                            data-testid="input-search"
                        >
                    </div>
                    <button 
                        id="search-button" 
                        class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-95"
                        data-testid="button-search"
                    >
                        Visualize
                    </button>
                </div>

                <div class="flex items-center gap-4">
                    <div class="hidden md:flex flex-col items-end">
                        <span class="text-[10px] uppercase tracking-widest text-muted-foreground font-semibold">Network</span>
                        <span class="text-xs text-green-400 flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span>
                            Mainnet
                        </span>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-hidden relative">
            <div id="visualizer-container" class="absolute inset-0 flex flex-col items-center justify-center p-4">
                <div class="max-w-md w-full text-center space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-1000">
                    <div class="w-16 h-16 bg-secondary rounded-2xl flex items-center justify-center mx-auto border border-border">
                        <svg class="w-8 h-8 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                        </svg>
                    </div>
                    <div class="space-y-2">
                        <h2 class="text-2xl font-semibold tracking-tight" id="status-title">Ready to Trace</h2>
                        <p class="text-muted-foreground" id="placeholder-message">Enter an Ethereum address above to explore transaction flows across the network.</p>
                    </div>
                    <div class="grid grid-cols-3 gap-4 pt-4 border-t border-border/50">
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-muted-foreground mb-1">Nodes</span>
                            <span class="text-lg font-mono text-primary">0</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-muted-foreground mb-1">Links</span>
                            <span class="text-lg font-mono text-primary">0</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-muted-foreground mb-1">Depth</span>
                            <span class="text-lg font-mono text-primary">1</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="border-t border-border bg-card/30 px-4 py-3">
            <div class="max-w-7xl mx-auto flex items-center justify-between text-[10px] uppercase tracking-wider text-muted-foreground">
                <div class="flex gap-4">
                    <span>© 2024 ETHFLOW LABS</span>
                    <span>V1.0.4-STABLE</span>
                </div>
                <div class="flex items-center gap-2">
                    <span>SYSTEM STORAGE: CONNECTED</span>
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                </div>
            </div>
        </footer>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
